<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Fale Conosco</title>
    </head>
    <body>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: 'Candara', sans-serif;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                background-image: url(https://static.vecteezy.com/ti/fotos-gratis/p1/1900914-cena-restaurante-turva-com-mesa-vazia-gratis-foto.jpg);
                background-size: cover;
                background-repeat: no-repeat;
            }

            .main {
                background-color: black;
                border: 2px solid khaki;
                border-radius: 15px;
                padding: 30px;
                width: 300px;
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
                color: khaki;
            }

            .main h2 {
                text-align: center;
                margin-bottom: 20px;
            }

            form {
                display: flex;
                flex-direction: column;
            }

            input {
                padding: 10px;
                margin-bottom: 15px;
                border-radius: 5px;
                border: 1px solid khaki;
            }

            button {
                padding: 10px;
                background-color: black;
                color: khaki;
                border: 5px solid khaki;
                border-radius: 8px;
                font-family: 'Candara', sans-serif;
                font-weight: bold;
                cursor: pointer;
                transition: background-color 0.3s;
            }

            button:hover {
                background-color: gray;
            }

            .text h1 {
                margin-bottom: 20px;
                font-size: 36px;
                color: khaki;
                text-align: center;
                background-color: black;
                border: 2px solid khaki;
                border-radius: 15px;
                padding: 5px;
            }

            .popup {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background-color: black;
                color: khaki;
                padding: 15px 30px;
                border-radius: 10px;
                font-weight: bold;
                box-shadow: 0 0 10px rgba(0 ,0, 0, 0.2);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.5s ease;
                z-index: 1000;
            }

            .popup.mostrar {
                opacity: 1;
                pointer-events: auto;
            }


        </style>

        <div class="text">
            <h1>Fale Conosco!</h1>

            <div class="main">
            <form>
                <label for="data">Data</label>
                <input type="date" id="data" name="data">

                <label for="hora">Horário</label>
                <input type="time" id="hora" name="hora">

                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome">

                <label for="rclm">Reclamação/Sugestão</label>
                <input type="text" id="rclm" name="rclm">

                <button type="submit">Enviar</button>
            </form>
            </div>
        </div>

        <div id="mensagem-ss" class="popup">
        Reclamação/Sugestão enviada com Sucesso!
    </div>



    </body>
    <script>

        const form = document.querySelector("form");
        const popup = document.getElementById("mensagem-ss");

        form.addEventListener("submit", function(e) {
            e.preventDefault();



            popup.classList.add("mostrar");

            setTimeout(() => {
                popup.classList.remove("mostrar");
                form.reset();
            }, 3000);
        });
    </script>
</html>
