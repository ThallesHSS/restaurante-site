<html>
    <head>
        <meta charset="utf-8">
        <title>Detalhes</title>
    </head>
    <body>
        <style>

            body {
                font-family: candara, sans-serif;
                padding-top: 90px;
                margin: 0;
            }

            header {
                background-color: black;
                color: khaki;
                padding: 10px;
                text-align: center;
                height: 80px;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                width: 100vw;
                height: 90px;
                z-index: 1000;
                font-family: 'TimesNewRoman';
                font-size: 20px;
            }
            
            .carrosel {
                margin: 0;
                width: 400px;
                height: 400px;
                overflow: hidden;
                position: relative;
                margin: 40px auto;
                
            }

            .anterior,
            .proximo {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background-color: rgb(0, 0, 0);
                color: khaki;
                border: solid khaki;
                border-radius: 15px;
                padding: 5px;
                cursor: pointer;
                font-size: 18px;
                font-family: Candara, sans-serif;
                z-index: 10;
            }

            .anterior {
                left: 10px;
            }

            .proximo {
                right: 10px;
            }

            .slides {
                display: flex;
                transition: transform 0.5s ease-in-out;
            }

            .slides img {
                width: 400px;
                height: 400px;
                object-fit: cover;
            }

            .swtxt {
                text-align: center;
                font-size: 20px;
                padding-top: 40px;
            }

        </style>

        <header>
            <h1>Detalhes sobre o desenvolvimento do trabalho</h1>
        </header>

    <section class="sweethm" id="sweethm">
                <div class="swtxt">
                    <h1>Sweet Home</h1>
                </div>

        <div class="carrosel">
            <div class="slides">
                <img src="https://thalleshss.github.io/restaurante-site/Desenvpage/Captura%20de%20Tela%20(9).png" alt="">
                <img src="https://thalleshss.github.io/restaurante-site/Desenvpage/Captura%20de%20Tela%20(7).png" alt="">
                <img src="https://thalleshss.github.io/restaurante-site/Desenvpage/Captura%20de%20Tela%20(8).png" alt="">
                <img src="https://www.einerd.com/wp-content/uploads/2024/08/SHADOW-890x606.jpg" alt="">
                <img src="https://www.einerd.com/wp-content/uploads/2024/08/SHADOW-890x606.jpg" alt="">
            </div>

                <button class="anterior">Ant.</button> 
                <button class="proximo">Prox.</button>
        </div>

        <div class="swp">
            <p></p>
        </div>


    </section>
                    <section class="uml" id="uml">

                    <div class="umltxt">
                        <h1>Diagrma UML</h1>
                    </div>

                        <div>
                            <img src="" alt="">
                        </div>

                            <div>
                                <p>O diagrama foi feito no site LucidChard, eu fiz algumas pesquisas no google para ter uma base com que eu conseguisse fazer o diagrama de uma forma facil</p>
                            </div>

                    </section>

            <section class="desenv" id="desenv">
                <div class="desenvtxt">
                    <h1>Desenvolvimento</h1>
                </div>

                    <div class="p-desenv">
                        <p></p>
                    </div>
            </section>



            <script>

                const botaoAnterior = document.querySelector(".anterior");
                const botaoProximo = document.querySelector(".proximo");

                const slides = document.querySelector(".slides");

                let index = 0;

                const totalSlides = slides.querySelectorAll("img").length;

                botaoProximo.addEventListener("click" , () => {
                    if(index < totalSlides - 1) {
                        index++;
                    }
                slides.style.transform = `translateX(-${index * 400}px)`;
            });

            botaoAnterior.addEventListener("click", () => {
                if(index > 0) {
                    index--;
                }
                slides.style.transform = `translateX(-${index * 400}px)`;
            });

            </script>
    </body>
</html>
